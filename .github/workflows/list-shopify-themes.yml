name: List Shopify themes

# Prints the themes on the store with their IDs, so you know what to pass as
# `theme_id` when running "Deploy theme to Shopify".

on:
  workflow_dispatch:

env:
  SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_STORE || 'bys-user-store-358852-skpnrnec.myshopify.com' }}

jobs:
  list:
    name: List themes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: List themes
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: shopify theme list
