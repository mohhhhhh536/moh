name: Validate theme

# Runs on every push and pull request. Needs no secrets — it only reads the
# files in the repo, so it is safe to run on forks.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Check section schemas and templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate
        run: python3 scripts/check-theme.py --theme-root theme
